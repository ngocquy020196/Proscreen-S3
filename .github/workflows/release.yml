name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers on version tags, e.g., v1.0.0, v1.1.2

permissions:
  contents: write # Required for creating GitHub Releases

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome Extension
        run: npm run build

      - name: Build Firefox Extension
        run: npm run build:firefox

      - name: Upload Chrome artifact
        uses: actions/upload-artifact@v4
        with:
          name: proscreen-s3-chrome
          path: dist/
          retention-days: 30

      - name: Upload Firefox artifact
        uses: actions/upload-artifact@v4
        with:
          name: proscreen-s3-firefox
          path: dist-firefox/
          retention-days: 30

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag version (${TAG}) does not match package.json (${PKG})"
            exit 1
          fi
          echo "✅ Version match: ${TAG}"

      - name: Package zips
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist && zip -r ../proscreen-s3-${{ github.ref_name }}.zip .
          cd ../dist-firefox && zip -r ../proscreen-s3-firefox-${{ github.ref_name }}.zip .

      - name: Upload release zips
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: |
            proscreen-s3-${{ github.ref_name }}.zip
            proscreen-s3-firefox-${{ github.ref_name }}.zip
          retention-days: 60

      - name: Extract changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${{ github.ref_name }}"
          awk "
            /^## ${VERSION}/{found=1; next}
            /^## v/{if(found) exit}
            /^---$/{if(found) exit}
            found{print}
          " CHANGELOG.md > release-notes.md
          echo "--- Release notes ---"
          cat release-notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            proscreen-s3-${{ github.ref_name }}.zip
            proscreen-s3-firefox-${{ github.ref_name }}.zip
