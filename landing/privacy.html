<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Privacy Policy - ProScreen S3</title>
    <meta name="description" content="Privacy Policy for ProScreen S3 browser extension." />
    <link rel="icon" type="image/png" href="images/icon128.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .privacy-page {
            padding: 120px 0 80px;
            min-height: 100vh;
        }

        .privacy-header {
            text-align: center;
            margin-bottom: 48px;
        }

        .privacy-header h1 {
            font-size: clamp(28px, 5vw, 40px);
            font-weight: 800;
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }

        .privacy-header p {
            color: var(--text-muted);
            font-size: 15px;
        }

        .privacy-content {
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.7;
            color: var(--text);
            background: var(--bg-card);
            padding: 48px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }

        .privacy-content h1 {
            display: none;
        }

        .privacy-content h2 {
            font-size: 20px;
            font-weight: 600;
            color: #fff;
            margin-top: 32px;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }

        .privacy-content h3 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
            margin-top: 24px;
            margin-bottom: 12px;
        }

        .privacy-content p {
            margin-bottom: 16px;
            color: var(--text-muted);
        }

        .privacy-content ul {
            padding-left: 24px;
            margin-bottom: 24px;
            color: var(--text-muted);
        }

        .privacy-content li {
            margin-bottom: 8px;
        }

        .privacy-content strong {
            font-weight: 600;
            color: #fff;
        }

        .privacy-content code {
            background: rgba(255, 255, 255, 0.1);
            color: #e5e7eb;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
        }

        .privacy-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 24px 0;
            font-size: 14px;
        }

        .privacy-content th,
        .privacy-content td {
            border: 1px solid var(--border);
            padding: 12px 16px;
            text-align: left;
        }

        .privacy-content th {
            background: rgba(255, 255, 255, 0.03);
            font-weight: 600;
            color: #fff;
        }

        .privacy-content td {
            color: var(--text-muted);
        }

        .privacy-content a {
            color: var(--accent-purple);
            text-decoration: none;
        }

        .privacy-content a:hover {
            text-decoration: underline;
        }

        .changelog-loading {
            text-align: center;
            color: var(--text-muted);
            padding: 60px 0;
            font-size: 14px;
        }

        .changelog-loading .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--accent-purple);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .privacy-content {
                padding: 24px;
            }
            .privacy-content table {
                display: block;
                overflow-x: auto;
            }
        }
    </style>
</head>

<body>
    <!-- Navigation -->
    <nav class="nav">
        <div class="nav-container">
            <a href="/" class="nav-logo">
                <img src="images/icon128.png" alt="ProScreen S3" width="32" height="32" />
                <span>ProScreen S3</span>
            </a>
            <div class="nav-links">
                <a href="/#features">Features</a>
                <a href="/#screenshots">Screenshots</a>
                <a href="/changelog.html">Changelog</a>
                <a href="https://github.com/ngocquy020196/proscreen-s3" target="_blank" rel="noopener" class="nav-github">
                    <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor">
                        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
                    </svg>
                    <span id="navStarCount">–</span>
                </a>
                <a href="/#install" class="nav-cta">Install Free</a>
            </div>
        </div>
    </nav>

    <!-- Privacy Policy -->
    <section class="privacy-page">
        <div class="container">
            <div class="privacy-header">
                <h1>Privacy Policy</h1>
                <p>Your privacy is our top priority</p>
            </div>

            <div id="privacyContent" class="privacy-content">
                <div class="changelog-loading">
                    <div class="spinner"></div>
                    Loading privacy policy...
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content">
                <div class="footer-brand">
                    <img src="images/icon128.png" alt="ProScreen S3" width="28" height="28" />
                    <span>ProScreen S3</span>
                </div>
                <div class="footer-links">
                    <a href="https://github.com/ngocquy020196/proscreen-s3" target="_blank" rel="noopener">GitHub</a>
                    <a href="/privacy.html" style="color: var(--accent-purple);">Privacy</a>
                    <a href="/changelog.html">Changelog</a>
                    <a href="https://ngocquy.dev" target="_blank" rel="noopener">Author</a>
                    <a href="mailto:contact@ngocquy.dev">Contact</a>
                    <a href="https://buymeacoffee.com/ngocquy.dev" target="_blank" rel="noopener">Buy Me a Coffee</a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>© 2026 Powered by <a href="https://ngocquy.dev" target="_blank" rel="noopener">Quy Nguyen</a>.
                    Version <span id="appVersion">x.x.x</span></p>
            </div>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        // Nav scroll effect
        const nav = document.querySelector('.nav');
        window.addEventListener('scroll', () => {
            nav.classList.toggle('nav-scrolled', window.scrollY > 50);
        });

        // Fetch GitHub star count
        fetch('https://api.github.com/repos/ngocquy020196/proscreen-s3')
            .then(r => r.json())
            .then(data => {
                if (data.stargazers_count !== undefined) {
                    document.getElementById('navStarCount').textContent = data.stargazers_count;
                }
            })
            .catch(() => { });

        // Fetch latest version
        fetch('https://api.github.com/repos/ngocquy020196/proscreen-s3/tags?per_page=1')
            .then(r => r.json())
            .then(tags => {
                if (tags.length && tags[0].name) {
                    document.getElementById('appVersion').textContent = tags[0].name.replace('v', '');
                }
            })
            .catch(() => { });

        // Fetch & parse PRIVACY_POLICY.md from GitHub
        fetch('https://raw.githubusercontent.com/ngocquy020196/proscreen-s3/main/PRIVACY_POLICY.md')
            .then(r => {
                if (!r.ok) throw new Error('Failed to fetch');
                return r.text();
            })
            .then(md => {
                const container = document.getElementById('privacyContent');
                container.innerHTML = marked.parse(md);
            })
            .catch(() => {
                document.getElementById('privacyContent').innerHTML =
                    '<div class="changelog-error"><p>Failed to load privacy policy.</p><p><a href="https://github.com/ngocquy020196/proscreen-s3/blob/main/PRIVACY_POLICY.md" target="_blank">View on GitHub</a></p></div>';
            });
    </script>
</body>

</html>
